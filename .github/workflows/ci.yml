name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        version: [stable, nightly]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.version }}
      - run: nvim --clean --headless --cmd "set rtp^=." -l tests/run.lua

  # Downloads the pinned core from this repo's releases and checks it against
  # the manifest — catches a manifest that points at a missing/mismatched asset.
  core-download:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install + health
        shell: bash
        run: |
          nvim --clean --headless --cmd "set rtp^=." \
            -c 'lua local p, e = require("jumpgraph.install").install({ sync = true }); if not p then print(e); vim.cmd("cq!") end' \
            -c 'checkhealth jumpgraph' -c 'sleep 2' -c 'w! health.txt' -c 'qa!'
          cat health.txt
          ! grep -q "ERROR" health.txt

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests build.lua
